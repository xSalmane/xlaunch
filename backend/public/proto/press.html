<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Press</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Funnel+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/proto/proto.css">
<style>
  body { background: #eef0f3; color: #0a0b0d; display: flex; flex-direction: column; }
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; }
  .hd b { font: 800 17px/1 "Funnel Display", sans-serif; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 7px; }
  .hd b i { width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 4px #0000ff, 0 0 0 2px #0000ff; }
  .tabs3 button { padding: 6px 11px; border-radius: 999px; background: transparent; font-weight: 700; font-size: 13px; color: #5b616e; }
  .tabs3 button.on { background: #0a0b0d; color: #fff; }
  main { position: relative; flex: 1; min-height: 0; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
  /* la presse */
  .press { position: relative; flex: 1; min-height: 0; margin: 0 14px; }
  .beam { position: absolute; left: 0; right: 0; top: 0; height: 26px; border-radius: 6px; background: repeating-linear-gradient(-45deg, #ffd12f 0 12px, #0a0b0d 12px 24px); }
  .col { position: absolute; top: 0; bottom: 0; width: 22px; background: #32353d; border-radius: 4px; }
  .col.l { left: 0; } .col.r { right: 0; }
  .ram { position: absolute; left: 50%; top: 26px; width: 120px; margin-left: -60px; z-index: 3; transform: translateY(0); }
  .ram .rod { width: 26px; height: 40px; margin: 0 auto; background: linear-gradient(90deg, #8b919d, #dee1e7, #8b919d); }
  .ram .head { height: 44px; border-radius: 8px; background: #b1b7c3; box-shadow: inset 0 -10px 0 #8b919d, 0 6px 14px rgb(0 0 0 / 0.25); }
  .anvil { position: absolute; left: 50%; bottom: 0; width: 170px; margin-left: -85px; height: 34px; border-radius: 10px 10px 4px 4px; background: #32353d; z-index: 1; }
  .blank { position: absolute; left: 50%; bottom: 30px; width: 104px; height: 104px; margin-left: -52px; z-index: 2; border-radius: 50%; background: #0000ff; box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 10px #0000ff, 0 8px 16px rgb(0 0 0 / 0.25); display: grid; place-items: center; overflow: hidden; }
  .blank .ghost { color: #fff; opacity: 0.4; font: 800 14px "Funnel Display", sans-serif; letter-spacing: -0.02em; }
  .blank .cov { opacity: 0; }
  .blank.struck .cov { opacity: 1; }
  .blank.struck .ghost { display: none; }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffd12f; z-index: 4; left: 50%; bottom: 120px; }
  .flash { position: absolute; left: 50%; bottom: 60px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #fff; z-index: 4; opacity: 0; }
  .shake { animation: shake 0.35s linear; }
  @keyframes shake { 20%, 60% { transform: translate(-5px, 3px); } 40%, 80% { transform: translate(5px, -3px); } }
  .minted { position: absolute; left: 0; right: 0; top: 34px; text-align: center; z-index: 5; opacity: 0; transform: translateY(-6px); transition: 0.4s; }
  .minted.on { opacity: 1; transform: none; }
  .minted span { display: inline-block; padding: 7px 14px; border-radius: 999px; background: #0a0b0d; color: #fff; font: 800 16px "Funnel Display", sans-serif; }
  form { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 10px 12px 12px; padding: 8px; border-radius: 16px; background: #fff; box-shadow: 0 8px 22px -12px rgb(0 0 0 / 0.35); }
  form input { border: 0; outline: none; padding: 8px 8px; font-size: 17px; font-weight: 600; min-width: 0; }
  form .meta { grid-column: 1 / -1; display: flex; gap: 6px; font-size: 12px; color: #5b616e; padding: 0 8px; }
  form .meta b { color: #0a0b0d; }
  form button { border: 0; border-radius: 999px; padding: 0 20px; background: #0a0b0d; color: #fff; font: 800 15px "Funnel Display", sans-serif; cursor: pointer; }
  .after { display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px; margin: 10px 12px 12px; }
  .after a { text-align: center; padding: 12px; border-radius: 999px; font-weight: 800; text-decoration: none; }
  .after .a1 { background: #0000ff; color: #fff; } .after .a2 { background: #fff; color: #0a0b0d; }
  /* coin pusher */
  .pusher { position: relative; flex: 1; margin: 4px 12px 0; perspective: 600px; }
  .tray { position: absolute; inset: 0 0 46px; border-radius: 14px; background: #dee1e7; transform: rotateX(38deg); transform-origin: 50% 100%; overflow: visible; box-shadow: inset 0 0 0 6px #b1b7c3; }
  .plate { position: absolute; left: 6px; right: 6px; top: 6px; height: 36px; border-radius: 8px; background: repeating-linear-gradient(-45deg, #ffd12f 0 10px, #0a0b0d 10px 20px); animation: push 2s ease-in-out infinite; z-index: 3; }
  @keyframes push { 50% { transform: translateY(26px); } }
  .pc { position: absolute; width: 74px; height: 74px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px #fff, 0 6px 10px rgb(0 0 0 / 0.25); transition: top 0.8s cubic-bezier(.3,.8,.3,1), opacity 0.5s, transform 0.8s; }
  .pc.drop { transform: translateY(120px) rotateX(70deg); opacity: 0; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: 700 14px "Funnel Display", sans-serif; }
  .ticker span { color: #5b616e; font: 500 13px "Funnel Sans", sans-serif; }
</style>
<script src="/static/app.js" defer></script><script src="/static/proto/proto-common.js" defer></script><script src="/static/proto/press.js" defer></script>
</head><body data-compact>
<header class="hd"><b><i></i>XLaunch</b><nav class="tabs3"><button class="on" data-v="mint">Mint</button><button data-v="hot">🔥 Hot</button><button data-v="hot">New</button></nav></header>
<main>
  <section class="scr" id="mint">
    <div class="press" id="press">
      <div class="col l"></div><div class="col r"></div><div class="beam"></div>
      <div class="ram" id="ram"><div class="rod"></div><div class="head"></div></div>
      <div class="blank" id="blank"><span class="ghost" id="ghost">$NEW</span><span class="cov" id="face"></span></div>
      <div class="anvil"></div><div class="flash" id="flash"></div>
      <div class="minted" id="minted"><span id="mintedTxt"></span></div>
    </div>
    <form id="f"><input id="name" placeholder="Name your token" autocomplete="off"><button id="go">Strike</button><div class="meta"><span>$<b id="tk">NEW</b></span><span>· Pair <b>ETH</b></span><span>· Gas <b>$0</b></span></div></form>
    <div class="after" id="after" hidden><a class="a1" href="#">Share on X</a><a class="a2" href="#">View token</a></div>
  </section>
  <section class="scr" id="hot" hidden>
    <div class="pusher"><div class="tray" id="tray"><div class="plate"></div></div><div class="ticker" id="tick"></div></div>
  </section>
</main>
</body></html>
