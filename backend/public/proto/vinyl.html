<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Funnel+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/proto/proto.css">
<style>
  body { background: #0a0b0d; color: #fff; display: flex; flex-direction: column; }
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; }
  .hd b { font: 800 17px "Funnel Display", sans-serif; display: inline-flex; gap: 7px; align-items: center; }
  .hd b i { width: 16px; height: 16px; border-radius: 50%; background: #0000ff; box-shadow: inset 0 0 0 4px #0a0b0d, 0 0 0 2px #0000ff; }
  .tabs3 button { background: none; color: #8b919d; padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 12.5px; }
  .tabs3 button.on { background: #0000ff; color: #fff; }
  main { position: relative; flex: 1; min-height: 0; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .deck { position: relative; flex: 1; margin: 0 10px; border-radius: 18px; background: #16181d; box-shadow: inset 0 0 0 1px #32353d; overflow: hidden; }
  .platter { position: absolute; right: 22px; top: 50%; width: 214px; height: 214px; margin-top: -107px; border-radius: 50%; background: #32353d; box-shadow: inset 0 0 0 4px #0000ff, 0 10px 24px rgb(0 0 0 / 0.5); }
  .platter::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #b1b7c3; }
  .sleeve { position: absolute; left: 18px; top: 50%; width: 170px; height: 170px; margin-top: -85px; border-radius: 6px; overflow: hidden; z-index: 3; box-shadow: 0 12px 26px rgb(0 0 0 / 0.55); transition: transform 0.6s cubic-bezier(.2,.9,.2,1); }
  .sleeve .tag { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: #fff; color: #0a0b0d; font: 800 13px "Funnel Display", sans-serif; padding: 3px 8px; border-radius: 4px; }
  .rec { position: absolute; left: 30px; top: 50%; width: 200px; height: 200px; margin-top: -100px; z-index: 2; transition: transform 1s cubic-bezier(.3,.8,.3,1); }
  .rec .disc { position: absolute; inset: 0; border-radius: 50%; }
  .rec .disc svg { width: 100%; height: 100%; display: block; }
  .rec .label { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px #0a0b0d; }
  .rec .label::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #0a0b0d; }
  .spin .disc, .spin .label { animation: spin 1.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .arm { position: absolute; right: 18px; top: 22px; width: 14px; height: 14px; z-index: 4; }
  .arm .base { position: absolute; inset: -10px; border-radius: 50%; background: #b1b7c3; box-shadow: inset 0 0 0 5px #8b919d; }
  .arm .bar { position: absolute; left: 50%; top: 50%; width: 5px; height: 150px; margin-left: -2.5px; background: linear-gradient(90deg, #8b919d, #eef0f3, #8b919d); border-radius: 3px; transform-origin: 50% 0; transform: rotate(28deg); transition: transform 0.9s cubic-bezier(.4,.1,.3,1); }
  .arm .bar::after { content: ""; position: absolute; left: -6px; bottom: -16px; width: 17px; height: 26px; border-radius: 3px; background: #eef0f3; }
  .arm.on .bar { transform: rotate(8deg); }
  .eq { position: absolute; left: 18px; bottom: 14px; display: flex; gap: 3px; align-items: flex-end; height: 34px; z-index: 3; opacity: 0; transition: opacity 0.4s; }
  .eq.on { opacity: 1; }
  .eq i { width: 6px; background: #3c8aff; border-radius: 2px; animation: eq 0.6s ease-in-out infinite alternate; }
  @keyframes eq { from { height: 4px; } to { height: 34px; } }
  .now { position: absolute; left: 18px; top: 14px; z-index: 3; opacity: 0; transition: opacity 0.4s; }
  .now.on { opacity: 1; }
  .now small { color: #8b919d; font-size: 12px; } .now b { display: block; font: 800 24px/1.05 "Funnel Display", sans-serif; letter-spacing: -0.02em; }
  form { display: flex; gap: 6px; margin: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; background: #16181d; box-shadow: inset 0 0 0 1px #32353d; }
  form input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; font-weight: 600; }
  form input::placeholder { color: #8b919d; }
  form button { border: 0; border-radius: 999px; padding: 9px 14px; background: #0000ff; color: #fff; font: 800 14px "Funnel Display", sans-serif; cursor: pointer; white-space: nowrap; }
  .after { display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px; margin: 10px; }
  .after a { text-align: center; padding: 11px; border-radius: 999px; font-weight: 800; text-decoration: none; }
  .after .a1 { background: #fff; color: #0a0b0d; } .after .a2 { box-shadow: inset 0 0 0 1px #32353d; color: #fff; }
  /* bac à disques */
  .crate { position: relative; flex: 1; margin: 0 10px 10px; perspective: 700px; overflow: hidden; border-radius: 18px; background: #16181d; }
  .crate .box { position: absolute; left: 30px; right: 30px; bottom: 0; height: 90px; background: #32353d; border-radius: 6px 6px 12px 12px; z-index: 50; box-shadow: inset 0 6px 0 #0000ff; }
  .crate .box span { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 700 13px "Funnel Sans", sans-serif; color: #b1b7c3; }
  .sl { position: absolute; left: 50%; bottom: 46px; width: 170px; height: 170px; margin-left: -85px; border-radius: 6px; overflow: hidden; transform-origin: 50% 100%; transition: transform 0.7s cubic-bezier(.3,.8,.3,1), opacity 0.5s; box-shadow: 0 -4px 12px rgb(0 0 0 / 0.5); }
  .sl .tag { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: #fff; color: #0a0b0d; font: 800 14px "Funnel Display", sans-serif; padding: 3px 8px; border-radius: 4px; }
  .sl .tag small { font: 600 11px "Funnel Sans", sans-serif; color: #5b616e; margin-left: 4px; }
</style>
<script src="/static/app.js" defer></script><script src="/static/proto/proto-common.js" defer></script><script src="/static/proto/vinyl.js" defer></script>
</head><body data-compact>
<header class="hd"><b><i></i>XLaunch</b><nav class="tabs3"><button class="on" data-v="deck">Decks</button><button data-v="crate">🔥 Hot</button><button data-v="crate">New</button></nav></header>
<main>
  <section class="scr" id="deck">
    <div class="deck">
      <div class="platter"></div>
      <div class="rec" id="rec"><div class="disc" id="disc"></div><div class="label cov" id="label"></div></div>
      <div class="sleeve cov" id="sleeve"></div>
      <div class="arm" id="arm"><div class="base"></div><div class="bar"></div></div>
      <div class="now" id="now"><small>Now playing on Base</small><b id="nowSym"></b></div>
      <div class="eq" id="eq"></div>
    </div>
    <form id="f"><input id="name" placeholder="Name your token" autocomplete="off"><button>Drop the needle</button></form>
    <div class="after" id="after" hidden><a class="a1" href="#">Share on X</a><a class="a2" href="#">Chart</a></div>
  </section>
  <section class="scr" id="crate" hidden><div class="crate" id="crateBox"><div class="box"><span id="crateTxt">Most liked today</span></div></div></section>
</main>
</body></html>
