<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/static/proto/proto.css">
<style>
  body { background: #0000ff; color: #fff; font: 500 12.5px/1.5 "JetBrains Mono", ui-monospace, monospace; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid rgb(255 255 255 / 0.25); }
  .bar b { font-weight: 800; }
  .bar .tabs3 { margin-left: auto; }
  .tabs3 button { background: none; color: rgb(255 255 255 / 0.7); padding: 2px 6px; font: 700 12px "JetBrains Mono", monospace; }
  .tabs3 button.on { background: #fff; color: #0000ff; }
  .scr { flex: 1; min-height: 0; overflow: hidden; padding: 10px 12px; position: relative; }
  .ln { white-space: pre-wrap; word-break: break-all; }
  .pr { color: rgb(255 255 255 / 0.65); }
  .ok { color: #b6f569; } .dim { color: rgb(255 255 255 / 0.6); } .y { color: #ffd12f; }
  .cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; }
  .cmd input, .cmd select { background: rgb(255 255 255 / 0.12); border: 0; border-bottom: 2px solid #fff; color: #fff; padding: 1px 4px; outline: none; font: 700 12.5px "JetBrains Mono", monospace; }
  .cmd input { width: 130px; }
  .cmd select option { color: #000; }
  .cur { display: inline-block; width: 8px; height: 15px; background: #fff; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .run { margin-top: 10px; border: 0; background: #fff; color: #0000ff; font: 800 13px "JetBrains Mono", monospace; padding: 7px 12px; cursor: pointer; }
  .ascii { font-weight: 800; line-height: 1.15; color: #fff; margin: 6px 0; }
  .btns { display: flex; gap: 10px; margin-top: 4px; }
  .btns a { color: #0000ff; background: #fff; padding: 3px 8px; text-decoration: none; font-weight: 800; }
  .btns a.o { background: none; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th { text-align: left; font-weight: 600; color: rgb(255 255 255 / 0.6); padding: 2px 4px; border-bottom: 1px dashed rgb(255 255 255 / 0.4); }
  td { padding: 3px 4px; } td.r, th.r { text-align: right; }
  td.hl { background: #fff; color: #0000ff; }
</style>
<script src="/static/app.js" defer></script><script src="/static/proto/proto-common.js" defer></script><script src="/static/proto/terminal.js" defer></script>
</head><body data-compact>
<div class="bar"><b>xlaunch@base</b><span class="dim">~/launch</span><nav class="tabs3"><button class="on" data-v="launch">launch</button><button data-v="top">top</button><button data-v="top">new</button></nav></div>
<section class="scr" id="launch">
  <div class="ln dim">XLaunch v2 · Base Sepolia · gas sponsored</div>
  <div class="ln dim">type a name, hit enter. no wallet needed.</div>
  <form id="f" class="ln cmd" style="margin-top:8px"><span class="pr">$</span><span>launch</span><span>"</span><input id="name" autocomplete="off" spellcheck="false"><span>"</span><span>--pair</span><select id="pair"><option>ETH</option><option>USDC</option><option>tNVDA</option></select><span class="cur"></span><button class="run" id="go">↵ run</button></form>
  <div id="out"></div>
</section>
<section class="scr" id="top" hidden><div class="ln"><span class="pr">$</span> xlaunch top --sort hot --live</div><table id="tbl"></table></section>
</body></html>
