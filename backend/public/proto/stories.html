<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stories</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Funnel+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/proto/proto.css">
<style>
  body { background: #0a0b0d; color: #fff; }
  .stage { position: absolute; inset: 0; perspective: 900px; overflow: hidden; }
  .st { position: absolute; inset: 0; backface-visibility: hidden; transform-origin: 50% 50% -204px; transition: transform 0.7s cubic-bezier(.4,.1,.3,1); overflow: hidden; background: #0000ff; }
  .st .cov { filter: none; }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / 0.45), transparent 26%, transparent 55%, rgb(0 0 0 / 0.65)); pointer-events: none; }
  .bars { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; z-index: 3; }
  .bars span { flex: 1; height: 3px; border-radius: 2px; background: rgb(255 255 255 / 0.35); overflow: hidden; }
  .bars span i { display: block; height: 100%; width: 0; background: #fff; }
  .bars span.done i { width: 100%; } .bars span.on i { animation: fill var(--d, 2.6s) linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .who { position: absolute; top: 20px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; z-index: 3; font-size: 13px; }
  .who .av { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #0000ff; display: grid; place-items: center; font-weight: 800; box-shadow: 0 0 0 2px #0000ff, 0 0 0 4px #fff; }
  .who span { opacity: 0.8; }
  .who .tabs3 { margin-left: auto; }
  .tabs3 button { background: rgb(0 0 0 / 0.35); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
  .tabs3 button.on { background: #fff; color: #0a0b0d; }
  /* écran Créer */
  .big { position: absolute; left: 0; right: 0; top: 112px; text-align: center; z-index: 2; }
  .big h1 { display: inline; margin: 0; font: 800 38px/1.25 "Funnel Display", sans-serif; letter-spacing: -0.03em; background: #fff; color: #0000ff; padding: 2px 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 6px; }
  .stk { position: absolute; z-index: 2; padding: 8px 14px; border-radius: 12px; font: 800 18px "Funnel Display", sans-serif; box-shadow: 0 8px 18px rgb(0 0 0 / 0.3); }
  .stk.t { left: 34px; top: 196px; background: #0a0b0d; color: #fff; transform: rotate(-7deg); }
  .stk.p { right: 34px; top: 200px; background: #ffd12f; color: #0a0b0d; transform: rotate(6deg); }
  .stk.g { left: 50%; top: 246px; margin-left: -54px; background: #66c800; color: #0a0b0d; transform: rotate(-2deg); font-size: 15px; }
  .bounce { animation: bounce 0.35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bounce { 50% { scale: 1.18; } }
  form { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; display: flex; gap: 8px; }
  form input { flex: 1; min-width: 0; border: 1.5px solid rgb(255 255 255 / 0.8); background: rgb(0 0 0 / 0.25); border-radius: 999px; padding: 10px 14px; color: #fff; outline: none; font-size: 15px; }
  form input::placeholder { color: rgb(255 255 255 / 0.75); }
  form button { border: 0; border-radius: 999px; padding: 0 16px; background: #fff; color: #0000ff; font: 800 15px "Funnel Display", sans-serif; cursor: pointer; }
  .posted { position: absolute; left: 50%; top: 150px; z-index: 4; transform: translateX(-50%) rotate(-4deg) scale(0); padding: 12px 18px; border-radius: 16px; background: #fff; color: #0a0b0d; text-align: center; transition: transform 0.5s cubic-bezier(.2,1.5,.4,1); }
  .posted.on { transform: translateX(-50%) rotate(-4deg) scale(1); }
  .posted b { display: block; font: 800 26px "Funnel Display", sans-serif; color: #0000ff; letter-spacing: -0.02em; }
  .heart { position: absolute; bottom: 60px; z-index: 4; font-size: 26px; pointer-events: none; }
  /* story d'un token */
  .cap { position: absolute; left: 12px; right: 12px; bottom: 58px; z-index: 2; }
  .cap h2 { margin: 0; font: 800 42px/1 "Funnel Display", sans-serif; letter-spacing: -0.04em; }
  .cap p { margin: 6px 0 0; font-size: 14px; opacity: 0.9; }
  .reply { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 8px; align-items: center; }
  .reply span { flex: 1; border: 1.5px solid rgb(255 255 255 / 0.7); border-radius: 999px; padding: 9px 14px; font-size: 14px; opacity: 0.9; }
  .reply b { font-size: 24px; } .reply a { background: #fff; color: #0a0b0d; padding: 9px 14px; border-radius: 999px; font-weight: 800; text-decoration: none; }
  .mstk { position: absolute; top: 70px; right: 14px; z-index: 2; background: #ffd12f; color: #0a0b0d; padding: 6px 12px; border-radius: 10px; font: 800 16px "Funnel Display", sans-serif; transform: rotate(5deg); }
</style>
<script src="/static/app.js" defer></script><script src="/static/proto/proto-common.js" defer></script><script src="/static/proto/stories.js" defer></script>
</head><body data-compact>
<div class="stage" id="stage"></div>
</body></html>
