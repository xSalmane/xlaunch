<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLaunch</title>
<!-- dans le tweet, chaque lien s'ouvre dans un nouvel onglet au lieu de remplacer la carte -->
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* La carte X : un terminal bleu Base. Tout tient dans ~400×400 ; la sortie défile dans le terminal. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: #0000ff; color: #fff; font: 500 12.5px/1.5 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .testnet { display: none; }
  a { color: inherit; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid rgb(255 255 255 / 0.3); white-space: nowrap; }
  .bar .usr { font-weight: 800; }
  .bar .cwd { color: rgb(255 255 255 / 0.65); }
  .tabs { display: flex; gap: 2px; margin-left: auto; }
  .tabs button, .bar .login { border: 0; background: none; color: rgb(255 255 255 / 0.75); padding: 2px 6px; font: 700 12px "JetBrains Mono", monospace; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: #fff; color: #0000ff; }
  .bar .login { color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }
  .bar .login:hover, .tabs button:hover { background: rgb(255 255 255 / 0.15); }
  .tabs button[aria-selected="true"]:hover { background: #fff; }

  .scr { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 14px; scrollbar-width: none; overscroll-behavior: contain; }
  .scr::-webkit-scrollbar { display: none; }
  .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
  .dim { color: rgb(255 255 255 / 0.62); }
  .ok { color: #b6f569; }
  .warn { color: #ffd12f; }
  .pr { color: rgb(255 255 255 / 0.62); }
  .cmd { display: grid; gap: 3px; margin-top: 8px; }
  .cl { display: flex; align-items: baseline; white-space: nowrap; min-width: 0; }
  .cl.in { padding-left: 2ch; }
  .cl .pr { margin-right: 1ch; }
  .cl .flag { width: 9ch; flex: none; }
  .bs { color: rgb(255 255 255 / 0.45); margin-left: 6px; }
  .cmd .flag { color: rgb(255 255 255 / 0.8); }
  .cmd input, .cmd select { background: rgb(255 255 255 / 0.12); border: 0; border-bottom: 2px solid #fff; border-radius: 0; color: #fff; padding: 1px 4px; outline: none; font: 700 12.5px "JetBrains Mono", monospace; min-width: 0; }
  .cmd input:focus, .cmd select:focus { background: rgb(255 255 255 / 0.24); }
  .cmd input::placeholder { color: rgb(255 255 255 / 0.5); font-weight: 500; }
  .cmd select option, .cmd select optgroup { color: #0a0b0d; background: #fff; }
  #name { width: 170px; } #symbol { width: 110px; text-transform: uppercase; } #description { width: 190px; }
  .attach { border: 0; background: none; color: #fff; font: 700 12.5px "JetBrains Mono", monospace; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .runrow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .btn-t { display: inline-block; border: 0; background: #fff; color: #0000ff; font: 800 13px "JetBrains Mono", monospace; padding: 6px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn-t:hover { background: #ebebff; }
  .btn-t:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-o { background: none; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }
  .btn-o:hover { background: rgb(255 255 255 / 0.15); }
  .quota { color: rgb(255 255 255 / 0.62); font-size: 11.5px; line-height: 1.3; }
  .cur { display: inline-block; width: 8px; height: 15px; background: #fff; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .ascii { font-weight: 800; line-height: 1.15; margin: 8px 0 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .out { margin-top: 10px; }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: rgb(255 255 255 / 0.62); padding: 2px 4px; border-bottom: 1px dashed rgb(255 255 255 / 0.45); }
  td { padding: 4px 4px; border-bottom: 1px solid rgb(255 255 255 / 0.1); }
  td.r, th.r { text-align: right; }
  td a { text-decoration: none; font-weight: 800; }
  td a:hover { text-decoration: underline; text-underline-offset: 3px; }
  td.hl { background: #fff; color: #0000ff; }
  .t-like { border: 0; background: none; color: #fff; font: 700 12.5px "JetBrains Mono", monospace; padding: 0 2px; cursor: pointer; }
  .t-like.on { color: #fea8cd; }
  .t-like.pop { animation: tpop 0.3s ease-out; }
  @keyframes tpop { 50% { transform: scale(1.4); } }
  .kv { display: grid; grid-template-columns: 82px 1fr; gap: 1px 10px; margin-top: 4px; }
  .kv dt { color: rgb(255 255 255 / 0.62); }
  .kv dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .like-big.on { background: #fea8cd; color: #0a0b0d; }
  @media (max-width: 380px) { .bar .cwd { display: none; } #name { width: 140px; } #description { width: 150px; } }
  @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>
<script src="/static/app.js" defer></script>
<script src="/static/embed.js" defer></script>
</head>
<body data-compact>
<header class="bar">
  <span class="usr" id="who">xlaunch@base</span><span class="cwd" id="cwd">~/launch</span>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-pane="launch" aria-selected="true">launch</button>
    <button type="button" role="tab" data-pane="trending" aria-selected="false">top</button>
    <button type="button" role="tab" data-pane="new" aria-selected="false">new</button>
  </nav>
  <button class="login" type="button" id="login" hidden>login</button>
</header>

<!-- lancement -->
<section class="scr" id="vLaunch" aria-live="polite">
  <div class="ln dim" id="intro">XLaunch · Base · gas sponsored</div>
  <div class="ln dim">fill the command, hit run. no wallet needed.</div>
  <form class="cmd" id="composer" novalidate>
    <div class="cl"><span class="pr">$</span> launch "<input id="name" maxlength="32" autocomplete="off" spellcheck="false" placeholder="token name" aria-label="Token name">" <span class="bs">\</span></div>
    <div class="cl in"><span class="flag">--ticker</span> <input id="symbol" maxlength="10" autocomplete="off" spellcheck="false" placeholder="TICKER" aria-label="Ticker"> <span class="bs">\</span></div>
    <div class="cl in"><span class="flag">--pair</span> <select id="pair" aria-label="Pair with"><option value="">ETH</option></select> <span class="bs">\</span></div>
    <div class="cl in"><span class="flag">--vibe</span> "<input id="description" maxlength="280" autocomplete="off" placeholder="optional" aria-label="Description">" <span class="bs">\</span></div>
    <div class="cl in"><span class="flag">--logo</span> <label class="attach" for="file" id="logoLbl">[ attach ]</label><input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></div>
  </form>
  <div class="runrow" id="runrow"><button class="btn-t" type="submit" form="composer" id="launchBtn">↵ run</button><span class="quota" id="quota">gas is on us</span></div>
  <div class="out" id="out"></div>
</section>

<!-- top / new -->
<section class="scr" id="vFeed" hidden>
  <div class="ln"><span class="pr">$</span> <span id="feedCmd">xlaunch top --sort hot --live</span></div>
  <table id="tbl"></table>
  <div class="ln dim" id="feedNote" style="margin-top:8px"></div>
</section>

<!-- token partagé (?token=…) -->
<section class="scr" id="vToken" hidden>
  <div class="ln"><span class="pr">$</span> <span id="infoCmd">xlaunch info</span></div>
  <div id="info"><div class="ln dim">loading…</div></div>
</section>
</body>
</html>
