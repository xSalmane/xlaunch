<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XLaunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<style>
  /* l'embed doit tenir dans la carte du tweet (480×600, réduite par X) et défiler si besoin */
  html, body { height: 100%; }
  body { font-size: 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .testnet { font-size: 12px; padding: 4px 10px; }
  .e { max-width: 480px; margin: 0 auto; padding: 10px 12px 14px; display: grid; gap: 10px; }
  .e-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .e-top .brand { font-size: 16px; }
  .e-top .brand-mark { width: 18px; height: 18px; }
  .e-top .auth { margin: 0; }
  .e-top .auth .who { width: auto; padding: 2px 4px; gap: 6px; }
  .e-top .auth .who img, .e-top .auth .who .avatar-ph { width: 24px; height: 24px; }
  .e-top .auth .who-txt b { font-size: 13px; }
  .e-top .auth .who-txt .mute, .e-top .auth .who-out { display: none; }
  .e-top .auth .btn { width: auto; padding: 6px 12px; font-size: 13px; }
  .e-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 9px; }
  .e-head { display: flex; gap: 10px; align-items: center; }
  .e-head h1 { font: 800 19px/1.1 var(--display); letter-spacing: -0.02em; margin: 0; }
  .e-pair { display: grid; grid-template-columns: 1.5fr 1fr; gap: 8px; }
  .e .field { gap: 4px; }
  .e .field > span { font-size: 13px; }
  .e .input { padding: 8px 10px; font-size: 14px; }
  .e textarea.input { min-height: 0; height: 46px; resize: none; }
  .e select.input { appearance: auto; }
  .e .btn.wide { padding: 10px 14px; }
  .e-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
  .e-stats dt { font-size: 12px; color: var(--mute); }
  .e-stats dd { margin: 2px 0 0; font: 700 18px/1.2 var(--display); }
  .e-foot { text-align: center; font-size: 12px; color: var(--mute); }
  .e-list { display: grid; }
  .e-list a { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .e-list a:first-child { border-top: 0; }
  .e-list .r { margin-left: auto; text-align: right; font-size: 13px; }
</style>
<script src="/static/app.js" defer></script>
<script src="/static/embed.js" defer></script>
</head>
<body data-compact>
<div class="e">
  <div class="e-top">
    <a class="brand" href="/" target="_blank" rel="noopener"><span class="brand-mark"></span>XLaunch</a>
    <div class="auth" data-auth></div>
  </div>

  <!-- fiche token (?token=…) -->
  <section class="e-card" id="tokenCard" hidden>
    <div class="e-head"><div id="tCoin"></div><div><h1 id="tTitle"></h1><div class="mute" id="tBy"></div></div></div>
    <dl class="e-stats">
      <div><dt>Market cap</dt><dd id="tMcap"></dd></div>
      <div><dt>24h change</dt><dd id="tChange"></dd></div>
    </dl>
    <a class="btn wide" id="tBuy" target="_blank" rel="noopener">Buy on Uniswap</a>
    <a class="btn quiet wide" id="tOpen" target="_blank" rel="noopener">See chart and trades</a>
    <button class="btn quiet wide" type="button" id="tOwn">Launch my own token</button>
  </section>

  <!-- lancement -->
  <form class="e-card" id="composer" novalidate>
    <div class="e-head">
      <div class="coin" id="coin" style="--s:40px;--h:220">$</div>
      <div><h1>Launch your token</h1><div class="mute" style="font-size:13px">On Base, gas on us.</div></div>
    </div>
    <div class="e-pair">
      <label class="field"><span>Name</span><input class="input" id="name" maxlength="32" autocomplete="off" placeholder="Moon Cat"></label>
      <label class="field"><span>Ticker</span><input class="input ticker-input" id="symbol" maxlength="10" autocomplete="off" placeholder="MCAT"></label>
    </div>
    <label class="field"><span>Pair with</span>
      <select class="input" id="pair"><option>ETH</option></select>
    </label>
    <label class="field"><span>Description <small>(optional)</small></span>
      <textarea class="input" id="description" maxlength="280" placeholder="In one line, why this token?"></textarea>
    </label>
    <div class="upload">
      <label class="btn quiet small" for="file">Add a logo</label>
      <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp">
      <span class="mute" id="fileInfo" style="font-size:12px">1 MB max.</span>
    </div>
    <div class="notice" id="msg" role="alert" hidden></div>
    <button class="btn wide" type="submit" id="launchBtn">Launch on Base</button>
    <div class="mute" id="quota" style="font-size:12px;text-align:center"></div>
  </form>

  <section class="e-card" id="done" hidden>
    <h1 style="font:800 22px/1.1 var(--display);margin:0" id="doneTitle"></h1>
    <p class="mute" style="margin:0">Share it: every trade earns you a cut of the fees.</p>
    <a class="btn wide" id="doneShare" target="_blank" rel="noopener"></a>
    <a class="btn quiet wide" id="donePage" target="_blank" rel="noopener">View token page</a>
  </section>

  <section class="e-card" id="recentCard">
    <div style="font-weight:700">Just launched</div>
    <div class="e-list" id="recent"><span class="mute">Loading…</span></div>
  </section>

  <div class="e-foot">Speculative tokens: only put in what you can afford to lose.</div>
</div>
</body>
</html>
