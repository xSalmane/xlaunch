<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--META-->
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
<script src="/static/explore.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side-nav" aria-label="Menu">
    <a class="brand" href="/" aria-label="XLaunch home"><span class="brand-mark"></span><span class="brand-name">XLaunch</span></a>
    <a class="nav-link" data-nav href="/"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
    <a class="nav-link" data-nav href="/explore"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Explore</span></a>
    <a class="nav-link" data-nav href="/me"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M15.5 9.2A6 6 0 1 1 9.2 15.5"/></svg><span>Earnings</span></a>
    <a class="btn btn-launch" href="/#compose" aria-label="Launch a token"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-7 0-12 5-13 12l-3 4"/><path d="M7 16h6c4 0 6-4 7-8"/></svg><span class="lbl">Launch a token</span></a>
    <div class="side-me" data-auth></div>
  </aside>

  <main class="column">
    <div class="mtop"><a class="brand" href="/"><span class="brand-mark"></span>XLaunch</a><div data-auth></div></div>
    <div class="col-head">
      <div class="col-title">
        <form class="search" style="flex:1" id="qform" role="search"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search tokens, $tickers, @creators, pairs" autocomplete="off" aria-label="Search tokens"></form>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-sort="new"><span>New</span></button>
        <button type="button" role="tab" aria-selected="false" data-sort="volume"><span>Trending</span></button>
        <button type="button" role="tab" aria-selected="false" data-sort="mcap"><span>Market cap</span></button>
      </div>
    </div>
    <div id="list"></div>
    <div class="feed-empty" id="empty" hidden></div>
    <div class="more"><button class="btn quiet" type="button" id="more" hidden>Show more</button></div>
  </main>

  <aside class="side-right" aria-label="Trending">
    <div class="side-right-inner">
      <form class="search" action="/explore" role="search"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input name="q" placeholder="Search tokens, $tickers, @creators" aria-label="Search tokens"></form>
      <section class="box"><h2>Trending</h2><div data-trends></div><a class="box-more" href="/explore?sort=volume">Show more</a></section>
      <section class="box"><h2>By the numbers</h2><div class="stats-box" data-stats></div></section>
      <p class="legal">Speculative tokens on Base: only put in what you can afford to lose. 100% of supply in a locked Uniswap pool, gas on us.</p>
    </div>
  </aside>
</div>
<nav class="tabbar" aria-label="Navigation">
  <a data-nav href="/" aria-label="Home"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
  <a data-nav href="/explore" aria-label="Explore"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  <a data-nav href="/me" aria-label="Earnings"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M15.5 9.2A6 6 0 1 1 9.2 15.5"/></svg></a>
</nav>
<a class="fab" href="/#compose" aria-label="Launch a token"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</body>
</html>
